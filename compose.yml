services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/dealer.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dealer_data:/app/data
      - dealer_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  dealer_data:
  dealer_backups:
