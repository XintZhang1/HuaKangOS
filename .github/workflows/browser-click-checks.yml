name: Current regression checks

on:
  workflow_dispatch:
    inputs:
      regression_capsule_asset_id:
        description: Frozen source-only regression capsule asset ID
        required: true
        type: string
      regression_capsule_sha256:
        description: Full frozen regression capsule SHA-256
        required: true
        type: string
      regression_mode:
        description: Prepare inventory, run full validation, or diagnose the fixed Windows preview group
        required: false
        default: prepare
        type: choice
        options: [prepare, full, diagnostic]
      regression_linux_only:
        description: Retry Linux preparation without repeating Windows inventory
        required: false
        default: false
        type: boolean
      regression_windows_only:
        description: Select Windows only; required for diagnostic mode
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: current-regression-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current-regression:
    permissions:
      contents: write
    uses: ./.github/workflows/full-regression-checks.yml
    with:
      capsule_asset_id: ${{ inputs.regression_capsule_asset_id }}
      capsule_sha256: ${{ inputs.regression_capsule_sha256 }}
      mode: ${{ inputs.regression_mode }}
      linux_only: ${{ inputs.regression_linux_only }}
      windows_only: ${{ inputs.regression_windows_only }}
