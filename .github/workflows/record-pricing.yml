name: Record pricing checks

on:
  pull_request:
    paths:
      - 'app/business_record*.py'
      - 'app/models.py'
      - 'app/security.py'
      - 'app/tenancy.py'
      - 'web/businessrecordpricing.js'
      - 'web/businessrecordflow.js'
      - 'web/businessrecords.js'
      - 'web/businessrecords.css'
      - 'requirements.txt'
      - 'tests/record_pricing/**'
      - '.github/workflows/record-pricing.yml'
  push:
    branches: [main]
    paths:
      - 'app/business_record*.py'
      - 'app/models.py'
      - 'app/security.py'
      - 'app/tenancy.py'
      - 'web/businessrecordpricing.js'
      - 'web/businessrecordflow.js'
      - 'web/businessrecords.js'
      - 'web/businessrecords.css'
      - 'requirements.txt'
      - 'tests/record_pricing/**'
      - '.github/workflows/record-pricing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Run source-only pricing checks
        run: python tests/record_pricing/run_isolated.py --output "$RUNNER_TEMP/record-pricing-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check changed JavaScript syntax
        run: |
          node --check web/businessrecordpricing.js
          node --check web/businessrecordflow.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-pricing-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/record-pricing-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          retention-days: 7
          if-no-files-found: warn
