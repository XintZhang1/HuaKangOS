name: Assistant offline checks

on:
  push:
    branches: [feature/assistant-agent-runtime]
    paths:
      - 'app/**'
      - 'web/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'tests/assistant_offline/**'
      - '.github/workflows/assistant-offline-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'tests/assistant_offline/**'
      - '.github/workflows/assistant-offline-checks.yml'

permissions:
  contents: read

concurrency:
  group: assistant-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned application and browser dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run isolated regressions with native browser transport
        run: >-
          python tests/assistant_offline/run_browser_pipeline.py
          --source "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/assistant-validation"
          --browser-mode native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/assistant-validation/evidence/
          retention-days: 7
          if-no-files-found: warn
