name: Assistant offline checks

on:
  push:
    branches: [feature/assistant-agent-runtime]
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/assistant_offline/**'
      - '.github/workflows/assistant-offline-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/assistant_offline/**'
      - '.github/workflows/assistant-offline-checks.yml'

permissions:
  contents: read

concurrency:
  group: assistant-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python without importing the application
        run: python -m compileall -q app migrations
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find web -name '*.js' -print0)
      - name: Run isolated offline regressions when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests/assistant_offline ]; then
            python -m unittest discover -s tests/assistant_offline -p 'test_*.py' -v
          fi
      - name: Package tracked source for reproducible offline review
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/assistant-review"
          git archive --format=tar.gz --output="$RUNNER_TEMP/assistant-review/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/assistant-review/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-source-${{ github.sha }}
          path: ${{ runner.temp }}/assistant-review/
          retention-days: 3
          if-no-files-found: error
